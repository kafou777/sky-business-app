# Publication de l'application pour la tester sur iPhone avec l'application gratuite « Expo Go »
# (sans compte Apple développeur et sans passer par l'App Store).
# Secrets / variables du dépôt nécessaires :
#   - secret EXPO_TOKEN        : jeton d'accès créé sur expo.dev (Account settings → Access tokens)
#   (projet expo.dev « skybusiness/sky-business », ID c78c8158-d898-4a50-a1f4-d2af7ef6e495)
# Le lien et le QR code à scanner avec l'iPhone s'affichent dans le résumé de l'exécution (onglet Actions).
name: iPhone (Expo Go)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: expo-go
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || 'c78c8158-d898-4a50-a1f4-d2af7ef6e495' }}
      SKY_EXPO_GO: '1'
    steps:
      - name: Vérifier la configuration
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EXPO_PROJECT_ID" ]; then
            echo "Ajoutez le secret EXPO_TOKEN (Settings → Secrets and variables → Actions)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::EXPO_TOKEN ou EXPO_PROJECT_ID manquant : publication Expo Go ignorée."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
        if: env.SKIP != '1'

      - uses: actions/setup-node@v5
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm

      - name: Installer
        if: env.SKIP != '1'
        run: |
          npm ci --no-audit --no-fund
          npx expo install expo-updates

      - name: Publier pour Expo Go (iPhone)
        if: env.SKIP != '1'
        run: |
          npx --yes eas-cli@latest update --branch expo-go --platform ios --non-interactive --json \
            --message "$(git log -1 --format=%s | cut -c1-200)" > update.json
          cat update.json
          GROUP=$(node -e "const u=require('./update.json');console.log((Array.isArray(u)?u[0]:u).group)")
          URL="https://qr.expo.dev/eas-update?projectId=$EXPO_PROJECT_ID&groupId=$GROUP"
          LINK=$(curl -fsS "$URL&format=url" || true)
          {
            echo "## Tester sur iPhone avec Expo Go"
            echo ""
            echo "1. Installez **Expo Go** depuis l'App Store et connectez-vous avec votre compte expo.dev."
            echo "2. Scannez ce QR code avec l'appareil photo de l'iPhone :"
            echo ""
            echo "![QR code]($URL)"
            echo ""
            [ -n "$LINK" ] && echo "Ou ouvrez ce lien sur l'iPhone : $LINK"
          } >> "$GITHUB_STEP_SUMMARY"
